version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: nexusmind-postgres
    environment:
      POSTGRES_USER: nexusmind
      POSTGRES_PASSWORD: nexusmind_password_2026
      POSTGRES_DB: nexusmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusmind -d nexusmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusmind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T01-07-28Z
    container_name: nexusmind-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: nexusmind-server
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://nexusmind:nexusmind_password_2026@postgres:5432/nexusmind_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_SECRET: "nexusmind_jwt_secret_key_change_in_prod_2026"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: nexusmind-web
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
