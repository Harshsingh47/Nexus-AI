apiVersion: v1
kind: Namespace
metadata:
  name: nexusmind
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusmind-config
  namespace: nexusmind
data:
  PORT: "4000"
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusmind-server
  namespace: nexusmind
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexusmind-server
  template:
    metadata:
      labels:
        app: nexusmind-server
    spec:
      containers:
      - name: server
        image: nexusmind/server:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: nexusmind-config
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexusmind-server-service
  namespace: nexusmind
spec:
  type: ClusterIP
  selector:
    app: nexusmind-server
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexusmind-server-hpa
  namespace: nexusmind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexusmind-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
